<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EZ Vampir Köylü — Köy</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14110c; overflow: hidden;
    font-family: 'Oswald', Arial, sans-serif; }
  #game { position: fixed; inset: 0; }
  #nameLayer { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .name-tag {
    position: absolute; top: 0; left: 0;
    padding: 2px 10px;
    background: rgba(10, 8, 6, 0.88);
    border: 1px solid rgba(255, 214, 150, 0.38);
    border-radius: 4px;
    font-size: 14px; font-weight: 500; letter-spacing: 0.04em;
    color: #efe1ab; white-space: nowrap;
    text-shadow: 0 1px 2px #000;
  }

  #hostPanel {
    position: fixed; top: 16px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 26px;
    background: linear-gradient(180deg, #7b5430, #573a22);
    border: 2px solid #32200f;
    border-radius: 6px;
    box-shadow: inset 0 1px 0 rgba(255,214,150,.28), 0 6px 18px rgba(0,0,0,.6);
  }
  #hostPanel img { width: 30px; image-rendering: pixelated; }
  #hostPanel .lines { display: grid; line-height: 1.15; }
  #hostPanel .eyebrow {
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #ffd89b;
  }
  #hostPanel .who { font-size: 22px; font-weight: 700; color: #efe1ab; letter-spacing: .04em; }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="nameLayer"></div>

  <div id="hostPanel">
    <img src="/assets/props/crown.png" alt="" />
    <div class="lines">
      <span class="eyebrow">Oyun sahibi</span>
      <span class="who">KICK:EMREZL</span>
    </div>
  </div>

  <script src="/vendor/phaser.min.js"></script>
  <script src="/js/scene.js"></script>
</body>
</html>
